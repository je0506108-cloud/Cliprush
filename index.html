<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClipRush - AI Clip Creator</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #10111b;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .card {
      max-width: 500px;
      margin: 40px auto;
      padding: 24px;
      background: #1d2030;
      border-radius: 18px;
    }
    h1 { color: #8b7cff; }
    p { color: #c8cada; line-height: 1.6; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 10px;
      font-size: 16px;
    }
    input {
      background: #10111b;
      border: 1px solid #454963;
      color: white;
    }
    button {
      background: #7565ff;
      color: white;
      border: none;
      font-weight: bold;
    }
    #status { margin-top: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>ClipRush ⚡</h1>
    <p>Turn your videos into shareable clips.</p>
    <input id="videoUrl" type="url"
      placeholder="Paste a supported video link">
    <button onclick="checkVideo()">Check Video Link</button>
    <p id="status">Ready when you are.</p>
  </div>
  <script>
    
     async function checkVideo() {
  const url = document.getElementById('videoUrl').value.trim();
  const status = document.getElementById('status');

  if (!url) {
    status.textContent = 'Please paste a video link first.';
    return;
  }

  try {
    new URL(url);
    status.textContent = 'Checking link...';

    const response = await fetch(
      'https://cliprush-api.onrender.com/v1/links/check',
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: url })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      status.textContent = 'Link check failed. Please try another link.';
      return;
    }

    status.textContent = JSON.stringify(data);
  } catch (error) {
    status.textContent =
      'Could not check this link. The API may be waking up or may need fixing.';
  }
     } 
      

        
      

      
        
            
      
      
        
          
      
      
  
  </script>
</body>
</html>
